<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | EduNexus</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .admin-page {
            min-height: 100vh;
            background: #f7f5fc;
            padding: 40px 20px;
        }

        .admin-container {
            max-width: 1100px;
            margin: auto;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .admin-title h1 {
            margin: 0 0 6px;
            font-size: 30px;
        }

        .admin-title p {
            margin: 0;
            color: #777;
        }

        .admin-card {
            background: #fff;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 30px rgba(30,20,60,.07);
        }

        .admin-card h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            border: 1px solid #ddd7eb;
            border-radius: 10px;
            padding: 12px 14px;
            font: inherit;
            outline: none;
            background: #fff;
        }

        .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #6c2cff;
        }

        .upload-btn,
        .logout-btn {
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            cursor: pointer;
            font-weight: 700;
        }

        .upload-btn {
            background: #6c2cff;
            color: white;
        }

        .upload-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .logout-btn {
            background: #eee9f8;
            color: #4b16c7;
        }

        .status {
            display: none;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 18px;
        }

        .status.show {
            display: block;
        }

        .status.success {
            background: #e9f9ef;
            color: #18733b;
        }

        .status.error {
            background: #fff0f0;
            color: #b42318;
        }

        .files-list {
            display: grid;
            gap: 12px;
        }

        .file-item {
            border: 1px solid #eee9f5;
            border-radius: 13px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .file-info {
            min-width: 0;
        }

        .file-name {
            font-weight: 700;
            word-break: break-word;
        }

        .file-meta {
            color: #777;
            font-size: 13px;
            margin-top: 5px;
        }

        .file-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .file-actions a,
        .delete-btn {
            border: none;
            border-radius: 8px;
            padding: 9px 13px;
            text-decoration: none;
            cursor: pointer;
            font-weight: 600;
        }

        .file-actions a {
            background: #f0ebff;
            color: #5b24d6;
        }

        .delete-btn {
            background: #fff0f0;
            color: #c62828;
        }

        .empty-state {
            text-align: center;
            padding: 35px 10px;
            color: #777;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .admin-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .file-item {
                align-items: flex-start;
                flex-direction: column;
            }

            .file-actions {
                width: 100%;
            }

            .file-actions a,
            .delete-btn {
                flex: 1;
                text-align: center;
            }
        }
    </style>
<link rel="stylesheet" href="assets/css/admin-cms.css">
</head>

<body>


<main class="admin-page">
    <div class="admin-container">

        <header class="admin-header">
            <div class="admin-title">
                <h1>EduNexus Admin Dashboard</h1>
                <p>Manage your educational files without editing code.</p>
            </div>

            <button type="button" class="logout-btn" id="logoutBtn">
                Logout
            </button>
        </header>

        <div id="status" class="status"></div>

        <section class="admin-card">
            <h2>Upload File</h2>

            <form id="uploadForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="classLevel">Class</label>
                        <select id="classLevel" name="classLevel" required>
                            <option value="">Select Class</option>
                            <option value="6">Class 6</option>
                            <option value="7">Class 7</option>
                            <option value="8">Class 8</option>
                            <option value="9">Class 9</option>
                            <option value="10">Class 10</option>
                            <option value="11">Class 11</option>
                            <option value="12">Class 12</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <select id="subject" name="subject" required disabled>
                            <option value="">Select Class First</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="contentType">Content Type</label>
                        <select id="contentType" name="contentType" required>
                            <option value="pdf">PDF</option>
                            <option value="notes">Notes</option>
                            <option value="mindmap">Mind Map</option>
                            <option value="assignment">Assignment</option>
                            <option value="question-paper">Question Paper</option>
                            <option value="ebook">E-Book</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="chapter">Chapter</label>
                        <input
                            type="text"
                            id="chapter"
                            name="chapter"
                            placeholder="e.g. Quadratic Equations"
                        >
                    </div>

                    <div class="form-group full">
                        <label for="title">Title</label>
                        <input
                            type="text"
                            id="title"
                            name="title"
                            placeholder="Enter content title..."
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" name="category">
                            <option value="general">General</option>
                            <option value="notes">Notes</option>
                            <option value="study-material">Study Material</option>
                            <option value="assignments">Assignments</option>
                            <option value="question-papers">Question Papers</option>
                            <option value="ebooks">E-Books</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="file">Select File</label>
                        <input
                            type="file"
                            id="file"
                            name="file"
                            required
                        >
                    </div>

                    <div class="form-group full">
                        <label for="description">Description</label>
                        <textarea
                            id="description"
                            name="description"
                            placeholder="Enter a short description..."
                        ></textarea>
                    </div>

                    <div class="form-group full">
                        <button type="submit" class="upload-btn" id="uploadBtn">
                            Upload File
                        </button>
                    </div>

                </div>
            </form>
        </section>

        <section class="admin-card">
            <h2>Uploaded Files</h2>

            <div id="filesList" class="files-list">
                <div class="empty-state">
                    Loading files...
                </div>
            </div>
        </section>

    </div>

<!-- =====================================================
     EDUNEXUS ADVANCED CMS WORKSPACE
===================================================== -->
<section id="cmsWorkspace" class="cms-workspace" style="display:none;">
    <div class="cms-workspace-header">
        <div>
            <span class="cms-eyebrow">EduNexus CMS</span>
            <h1 id="cmsWorkspaceTitle">Content Management</h1>
            <p id="cmsWorkspaceSubtitle">
                Manage website content directly from the admin panel.
            </p>
        </div>
    </div>
    <div id="cmsWorkspaceContent"></div>
</section>

</main>

<script src="admin.js"></script>

<script src="assets/js/admin-cms.js"></script>


<script>
(function () {
    'use strict';

    const modules = {
        notes: 'Notes',
        videos: 'Videos',
        pyqs: 'PYQs',
        quizzes: 'Quizzes',
        'mock-tests': 'Mock Tests',
        mindmaps: 'Mind Maps',
        'live-classes': 'Live Classes'
    };

    function openCMS(module) {
        const workspace = document.getElementById('cmsWorkspace');
        const content = document.getElementById('cmsWorkspaceContent');
        const title = document.getElementById('cmsWorkspaceTitle');
        const subtitle = document.getElementById('cmsWorkspaceSubtitle');

        if (!workspace || !content || !modules[module]) return;

        workspace.style.display = '';
        title.textContent = modules[module];
        subtitle.textContent =
            'Manage ' + modules[module].toLowerCase() +
            ' with search, filters, pagination and actions.';

        content.innerHTML = `
            <div class="cms-card">
                <div id="cmsLiveList"></div>
            </div>
        `;

        const list = document.getElementById('cmsLiveList');

        if (window.EduNexusCMSList &&
            typeof window.EduNexusCMSList.load === 'function') {
            window.EduNexusCMSList.load(module, list);
        } else {
            list.innerHTML = `
                <div class="cms-empty">
                    CMS engine is not ready. Refresh the page and try again.
                </div>
            `;
        }

        workspace.scrollIntoView({
            behavior: 'smooth',
            block: 'start'
        });
    }

    window.EduNexusOpenCMS = openCMS;

    document.addEventListener('click', function (event) {
        const item = event.target.closest('[data-cms-module]');
        if (!item) return;

        event.preventDefault();

        const module = item.getAttribute('data-cms-module');
        if (module) openCMS(module);
    });

})();
</script>

</body>
</html>

<script>
(function () {
  const token = localStorage.getItem('edunexusToken');
  const API = window.EDUNEXUS_API_BASE || 'https://edunexusbyneerajpal.onrender.com/api';

  async function loadDashboardStats() {
    if (!token) return;

    try {
      const res = await fetch(API + '/admin/stats', {
        headers: {
          Authorization: 'Bearer ' + token
        }
      });

      if (!res.ok) return;

      const result = await res.json();
      const s = result.stats || {};

      const set = (id, value) => {
        const el = document.getElementById(id);
        if (el) el.textContent = value ?? 0;
      };

      set('statUsers', s.users);
      set('statStudents', s.students);
      set('statNotes', s.notes);
      set('statVideos', s.videos);
    } catch (e) {
      console.error('Dashboard stats error:', e);
    }
  }

  loadDashboardStats();
})();
</script>

<script>
(function () {
  const token = localStorage.getItem('edunexusToken');
  const API = window.EDUNEXUS_API_BASE || 'https://edunexusbyneerajpal.onrender.com/api';

  async function loadContent(endpoint, sectionId) {
    const section = document.getElementById(sectionId);
    if (!section || !token) return;

    let container = section.querySelector('.cms-data');
    if (!container) {
      container = document.createElement('div');
      container.className = 'cms-data';
      section.appendChild(container);
    }

    container.innerHTML = '<p>Loading...</p>';

    try {
      const res = await fetch(API + endpoint + '?page=1&limit=20', {
        headers: { Authorization: 'Bearer ' + token }
      });

      const result = await res.json();
      const items = result.data || result.items || [];

      if (!res.ok) throw new Error(result.message || 'Request failed');

      if (!items.length) {
        container.innerHTML = '<p>No content found.</p>';
        return;
      }

      container.innerHTML = `
        <div style="overflow:auto;margin-top:20px">
          <table style="width:100%;border-collapse:collapse">
            <thead>
              <tr>
                <th style="text-align:left;padding:10px">Title</th>
                <th style="text-align:left;padding:10px">Status</th>
                <th style="text-align:left;padding:10px">Created</th>
              </tr>
            </thead>
            <tbody>
              ${items.map(item => `
                <tr>
                  <td style="padding:10px">${escapeHTML(item.title || item.name || 'Untitled')}</td>
                  <td style="padding:10px">
                    ${item.published ? 'Published' : 'Draft'}
                  </td>
                  <td style="padding:10px">
                    ${item.createdAt ? new Date(item.createdAt).toLocaleDateString() : '-'}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    } catch (err) {
      container.innerHTML =
        '<p style="color:#dc2626">Unable to load content.</p>';
      console.error(endpoint, err);
    }
  }

  function escapeHTML(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  window.loadAdminContent = function () {
    loadContent('/notes', 'notes');
    loadContent('/videos', 'videos');
    loadContent('/quizzes', 'quizzes');
    loadContent('/mindmaps', 'mindmaps');
    loadContent('/live-classes', 'live-classes');
  };

  window.loadAdminContent();
})();
</script>

<script>
(function () {
  const token = localStorage.getItem('edunexusToken');
  const API = window.EDUNEXUS_API_BASE || 'https://edunexusbyneerajpal.onrender.com/api';

  async function loadAdminUsers() {
    const table = document.getElementById('usersTable');
    if (!table || !token) return;

    table.innerHTML = '<tr><td colspan="6">Loading users...</td></tr>';

    try {
      const res = await fetch(API + '/admin/users?page=1&limit=50', {
        headers: { Authorization: 'Bearer ' + token }
      });

      const result = await res.json();
      if (!res.ok) throw new Error(result.message || 'Failed');

      const users = result.data || result.users || [];

      if (!users.length) {
        table.innerHTML = '<tr><td colspan="6">No users found.</td></tr>';
        return;
      }

      table.innerHTML = users.map(user => `
        <tr>
          <td>${escapeHTML(user.name || '-')}</td>
          <td>${escapeHTML(user.email || '-')}</td>
          <td>${escapeHTML(user.role || 'student')}</td>
          <td>${user.active === false ? 'Inactive' : 'Active'}</td>
          <td>${user.createdAt ? new Date(user.createdAt).toLocaleDateString() : '-'}</td>
          <td>
            <button onclick="toggleUserStatus('${user._id}', ${user.active !== false})">
              ${user.active === false ? 'Activate' : 'Deactivate'}
            </button>
          </td>
        </tr>
      `).join('');
    } catch (err) {
      console.error(err);
      table.innerHTML =
        '<tr><td colspan="6" style="color:#dc2626">Unable to load users.</td></tr>';
    }
  }

  function escapeHTML(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  window.toggleUserStatus = async function (id, currentlyActive) {
    if (!confirm(currentlyActive
      ? 'Deactivate this user?'
      : 'Activate this user?')) return;

    try {
      const res = await fetch(API + '/admin/users/' + id + '/status', {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + token
        },
        body: JSON.stringify({
          active: !currentlyActive
        })
      });

      const result = await res.json();

      if (!res.ok) throw new Error(result.message || 'Failed');

      alert('User status updated successfully.');
      loadAdminUsers();
    } catch (err) {
      alert(err.message || 'Unable to update user.');
    }
  };

  window.loadAdminUsers = loadAdminUsers;

  document.addEventListener('DOMContentLoaded', loadAdminUsers);
})();
</script>

<script>
(function () {
  const token = localStorage.getItem('edunexusToken');
  const API = window.EDUNEXUS_API_BASE || 'https://edunexusbyneerajpal.onrender.com/api';

  async function adminRequest(url, options = {}) {
    const res = await fetch(API + url, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        Authorization: 'Bearer ' + token,
        ...(options.headers || {})
      }
    });

    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || 'Request failed');
    return data;
  }

  async function loadAnnouncements() {
    const box = document.getElementById('announcementList');
    if (!box || !token) return;

    box.innerHTML = '<p>Loading announcements...</p>';

    try {
      const result = await adminRequest('/admin/announcements');
      const items = result.data || result.announcements || result || [];

      if (!Array.isArray(items) || !items.length) {
        box.innerHTML = '<p>No announcements found.</p>';
        return;
      }

      box.innerHTML = items.map(a => `
        <div style="padding:15px;margin:10px 0;border:1px solid #ddd;border-radius:10px">
          <strong>${escapeHTML(a.title || 'Untitled')}</strong>
          <p>${escapeHTML(a.message || '')}</p>
          <small>
            ${a.published ? 'Published' : 'Draft'}
            ${a.priority != null ? ' • Priority: ' + a.priority : ''}
          </small>
        </div>
      `).join('');
    } catch (err) {
      console.error(err);
      box.innerHTML =
        '<p style="color:#dc2626">Unable to load announcements.</p>';
    }
  }

  async function loadActivity() {
    const section = document.getElementById('activity');
    if (!section || !token) return;

    let box = section.querySelector('.activity-data');

    if (!box) {
      box = document.createElement('div');
      box.className = 'activity-data';
      section.appendChild(box);
    }

    box.innerHTML = '<p>Loading activity...</p>';

    try {
      const result = await adminRequest('/admin/activity?limit=30');
      const items = result.data || result.activities || result || [];

      if (!Array.isArray(items) || !items.length) {
        box.innerHTML = '<p>No activity found.</p>';
        return;
      }

      box.innerHTML = `
        <div style="overflow:auto;margin-top:20px">
          <table style="width:100%;border-collapse:collapse">
            <thead>
              <tr>
                <th style="text-align:left;padding:10px">Action</th>
                <th style="text-align:left;padding:10px">Module</th>
                <th style="text-align:left;padding:10px">Description</th>
                <th style="text-align:left;padding:10px">Date</th>
              </tr>
            </thead>
            <tbody>
              ${items.map(a => `
                <tr>
                  <td style="padding:10px">${escapeHTML(a.action || '-')}</td>
                  <td style="padding:10px">${escapeHTML(a.module || '-')}</td>
                  <td style="padding:10px">${escapeHTML(a.description || '-')}</td>
                  <td style="padding:10px">
                    ${a.createdAt ? new Date(a.createdAt).toLocaleString() : '-'}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    } catch (err) {
      console.error(err);
      box.innerHTML =
        '<p style="color:#dc2626">Unable to load activity.</p>';
    }
  }

  function escapeHTML(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  window.loadAdminAnnouncements = loadAnnouncements;
  window.loadAdminActivity = loadActivity;

  document.addEventListener('DOMContentLoaded', () => {
    loadAnnouncements();
    loadActivity();
  });
})();
</script>

<script>
(function () {
  const token = localStorage.getItem('edunexusToken');
  const API = window.EDUNEXUS_API_BASE || 'https://edunexusbyneerajpal.onrender.com/api';

  async function loadSiteSettings() {
    const section = document.getElementById('site-settings');
    if (!section || !token) return;

    let box = section.querySelector('.settings-data');

    if (!box) {
      box = document.createElement('div');
      box.className = 'settings-data';
      section.appendChild(box);
    }

    box.innerHTML = '<p>Loading settings...</p>';

    try {
      const res = await fetch(API + '/admin/settings', {
        headers: {
          Authorization: 'Bearer ' + token
        }
      });

      const result = await res.json();

      if (!res.ok) {
        throw new Error(result.message || 'Failed to load settings');
      }

      const settings = result.data || result.settings || result || [];

      if (!Array.isArray(settings) || !settings.length) {
        box.innerHTML = '<p>No site settings configured yet.</p>';
        return;
      }

      box.innerHTML = `
        <div style="overflow:auto;margin-top:20px">
          <table style="width:100%;border-collapse:collapse">
            <thead>
              <tr>
                <th style="text-align:left;padding:10px">Key</th>
                <th style="text-align:left;padding:10px">Value</th>
                <th style="text-align:left;padding:10px">Public</th>
                <th style="text-align:left;padding:10px">Action</th>
              </tr>
            </thead>
            <tbody>
              ${settings.map(s => `
                <tr>
                  <td style="padding:10px">
                    ${escapeHTML(s.key || '-')}
                  </td>

                  <td style="padding:10px">
                    <input
                      id="setting-${escapeHTML(s.key)}"
                      value="${escapeHTML(
                        typeof s.value === 'object'
                          ? JSON.stringify(s.value)
                          : (s.value ?? '')
                      )}"
                      style="width:100%;padding:8px"
                    >
                  </td>

                  <td style="padding:10px">
                    ${s.public === false ? 'Private' : 'Public'}
                  </td>

                  <td style="padding:10px">
                    <button onclick="saveSiteSetting('${encodeURIComponent(s.key)}')">
                      Save
                    </button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    } catch (err) {
      console.error(err);
      box.innerHTML =
        '<p style="color:#dc2626">Unable to load site settings.</p>';
    }
  }

  window.saveSiteSetting = async function (encodedKey) {
    const key = decodeURIComponent(encodedKey);
    const input = document.getElementById('setting-' + key);

    if (!input) return;

    try {
      let value = input.value;

      try {
        value = JSON.parse(value);
      } catch (_) {}

      const res = await fetch(
        API + '/admin/settings/' + encodeURIComponent(key),
        {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + token
          },
          body: JSON.stringify({ value })
        }
      );

      const result = await res.json();

      if (!res.ok) {
        throw new Error(result.message || 'Failed to save setting');
      }

      alert('Setting saved successfully.');
      loadSiteSettings();
    } catch (err) {
      alert(err.message || 'Unable to save setting.');
    }
  };

  function escapeHTML(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  document.addEventListener('DOMContentLoaded', loadSiteSettings);
})();
</script>

<script>
(function () {
  const token = localStorage.getItem('edunexusToken');
  const API = window.EDUNEXUS_API_BASE || 'https://edunexusbyneerajpal.onrender.com/api';

  async function loadCMSList(endpoint, sectionId) {
    const section = document.getElementById(sectionId);
    if (!section || !token) return;

    let box = section.querySelector('.cms-api-data');

    if (!box) {
      box = document.createElement('div');
      box.className = 'cms-api-data';
      section.appendChild(box);
    }

    box.innerHTML = '<p>Loading...</p>';

    try {
      const res = await fetch(API + endpoint + '?page=1&limit=20', {
        headers: { Authorization: 'Bearer ' + token }
      });

      const result = await res.json();

      if (!res.ok) {
        throw new Error(result.message || 'Failed');
      }

      const items = result.data || result.items || [];

      if (!items.length) {
        box.innerHTML = '<p>No items found.</p>';
        return;
      }

      box.innerHTML = `
        <div style="overflow:auto;margin-top:20px">
          <table style="width:100%;border-collapse:collapse">
            <thead>
              <tr>
                <th style="text-align:left;padding:10px">Title</th>
                <th style="text-align:left;padding:10px">Status</th>
                <th style="text-align:left;padding:10px">Created</th>
              </tr>
            </thead>
            <tbody>
              ${items.map(item => `
                <tr>
                  <td style="padding:10px">
                    ${escapeHTML(item.title || 'Untitled')}
                  </td>
                  <td style="padding:10px">
                    ${escapeHTML(
                      item.status ||
                      (item.published ? 'Published' : 'Draft')
                    )}
                  </td>
                  <td style="padding:10px">
                    ${item.createdAt
                      ? new Date(item.createdAt).toLocaleDateString()
                      : '-'}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    } catch (err) {
      console.error(endpoint, err);
      box.innerHTML =
        '<p style="color:#dc2626">Unable to load data.</p>';
    }
  }

  function escapeHTML(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  document.addEventListener('DOMContentLoaded', function () {
    loadCMSList('/pyqs', 'pyqs');
    loadCMSList('/mock-tests', 'mock-tests');
  });
})();
</script>

<script>
(function () {
  const API = window.EDUNEXUS_API_BASE ||
    'https://edunexusbyneerajpal.onrender.com/api';

  async function loadSystemStatus() {
    const section = document.getElementById('system-status');
    if (!section) return;

    let box = section.querySelector('.system-status-data');

    if (!box) {
      box = document.createElement('div');
      box.className = 'system-status-data';
      section.appendChild(box);
    }

    box.innerHTML = '<p>Checking system...</p>';

    try {
      const start = performance.now();

      const res = await fetch(API + '/health');
      const data = await res.json();

      const latency = Math.round(performance.now() - start);

      if (!res.ok || !data.ok) {
        throw new Error('API unavailable');
      }

      box.innerHTML = `
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-top:20px">

          <div style="padding:20px;border:1px solid #ddd;border-radius:12px">
            <strong>API Status</strong>
            <div style="margin-top:8px">🟢 Online</div>
          </div>

          <div style="padding:20px;border:1px solid #ddd;border-radius:12px">
            <strong>Response Time</strong>
            <div style="margin-top:8px">${latency} ms</div>
          </div>

          <div style="padding:20px;border:1px solid #ddd;border-radius:12px">
            <strong>Service</strong>
            <div style="margin-top:8px">${escapeHTML(data.service || 'EduNexus API')}</div>
          </div>

          <div style="padding:20px;border:1px solid #ddd;border-radius:12px">
            <strong>Last Check</strong>
            <div style="margin-top:8px">
              ${data.time ? new Date(data.time).toLocaleString() : '-'}
            </div>
          </div>

        </div>
      `;
    } catch (error) {
      console.error(error);

      box.innerHTML = `
        <div style="padding:20px;border:1px solid #ddd;border-radius:12px;color:#dc2626">
          🔴 API Offline / Unreachable
        </div>
      `;
    }
  }

  function escapeHTML(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  document.addEventListener('DOMContentLoaded', loadSystemStatus);

  window.loadSystemStatus = loadSystemStatus;
})();
</script>

<script>
(function () {
    'use strict';

    const modules = {
        'notes': 'Notes',
        'videos': 'Videos',
        'pyqs': 'PYQs',
        'quizzes': 'Quizzes',
        'mock-tests': 'Mock Tests',
        'mindmaps': 'Mind Maps',
        'live-classes': 'Live Classes'
    };

    function openCMS(module) {
        const workspace = document.getElementById('cmsWorkspace');
        const content = document.getElementById('cmsWorkspaceContent');
        const title = document.getElementById('cmsWorkspaceTitle');
        const subtitle = document.getElementById('cmsWorkspaceSubtitle');

        if (!workspace || !content || !title) return;

        workspace.style.display = 'block';
        title.textContent = modules[module] || 'Content Management';

        if (subtitle) {
            subtitle.textContent =
                'Manage, search, filter, edit, publish and delete content.';
        }

        content.innerHTML =
            '<div id="cmsLiveList"><div class="cms-loading">Loading...</div></div>';

        const list = document.getElementById('cmsLiveList');

        if (window.EduNexusCMSList &&
            typeof window.EduNexusCMSList.load === 'function') {

            window.EduNexusCMSList.load(module, list);

        } else {
            list.innerHTML =
                '<div class="cms-empty">CMS engine unavailable. Refresh the page.</div>';
        }

        workspace.scrollIntoView({
            behavior: 'smooth',
            block: 'start'
        });
    }

    window.EduNexusOpenCMS = openCMS;

    document.addEventListener('click', function (e) {
        const el = e.target.closest('[data-cms-module]');
        if (!el) return;

        e.preventDefault();

        const module = el.getAttribute('data-cms-module');

        if (modules[module]) {
            openCMS(module);
        }
    });

    document.addEventListener('DOMContentLoaded', function () {

        const textMap = {
            'Notes': 'notes',
            'Videos': 'videos',
            'PYQs': 'pyqs',
            'Quizzes': 'quizzes',
            'Mock Tests': 'mock-tests',
            'Mind Maps': 'mindmaps',
            'Live Classes': 'live-classes'
        };

        document.querySelectorAll('a,button').forEach(function (el) {

            const text = el.textContent.trim()
                .replace(/\s+/g, ' ');

            const module = textMap[text];

            if (module && !el.hasAttribute('data-cms-module')) {
                el.setAttribute('data-cms-module', module);
            }

        });

    });

})();
</script>
