<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard | EduNexus</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">
<style>
.dashboard-wrap{
    max-width:1100px;
    margin:60px auto;
    padding:20px;
}
.dashboard-card{
    padding:35px;
    border-radius:20px;
    background:#fff;
    box-shadow:0 10px 35px rgba(0,0,0,.08);
}
.dashboard-card h1{margin-bottom:10px}
.dashboard-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
    margin-top:30px;
}
.dashboard-item{
    padding:25px;
    border-radius:16px;
    background:#f6f3ff;
    text-decoration:none;
    color:inherit;
}
.logout-btn{
    margin-top:25px;
    padding:12px 22px;
    border:0;
    border-radius:10px;
    cursor:pointer;
    background:#6c2cff;
    color:#fff;
}
</style>
</head>

<body>

<div class="dashboard-wrap">
    <div class="dashboard-card">
        <h1>Welcome, <span id="studentName">Student</span> 👋</h1>
        <p>Your EduNexus Student Dashboard</p>

        <div class="dashboard-grid">
            <a class="dashboard-item" href="index.html">
                🏠<br><strong>Home</strong>
            </a>

            <a class="dashboard-item" href="notes.html">
                📚<br><strong>Notes</strong>
            </a>

            <a class="dashboard-item" href="quizzes.html">
                📝<br><strong>Quizzes</strong>
            </a>

            <a class="dashboard-item" href="videos.html">
                🎥<br><strong>Videos</strong>
            </a>
        </div>

        <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
</div>

<script src="api.js"></script>
<script>
const user = JSON.parse(
    localStorage.getItem("edunexusUser") || "null"
);

const token = localStorage.getItem("edunexusToken");

if (!token || !user) {
    window.location.href = "login.html";
} else {
    document.getElementById("studentName").textContent =
        user.name || "Student";
}

document.getElementById("logoutBtn").addEventListener("click", () => {
    window.EduNexusAPI.logout();
});
</script>

</body>
</html>
